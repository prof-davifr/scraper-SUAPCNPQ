name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  importa:
    # Não há suíte de testes. O que este job pega é quebra de dependência e de
    # assinatura — como o xlrd pela metade que já zerou uma exportação no
    # scraper-SUAPPos. Mudança de HTML do SUAP, só a coleta real pega.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar todos os módulos
        run: python -m compileall -q core utils app scripts main.py

      - name: Importar os módulos que não dependem de navegador
        run: |
          python -c "from core.processor import merge_production_data, read_excel_sheets; print('core.processor OK')"
          python -c "from utils.logger import log_msg; print('utils.logger OK')"

      - name: Importar o coletor (depende do playwright)
        run: python -c "import core.scraper; print('core.scraper OK')"
